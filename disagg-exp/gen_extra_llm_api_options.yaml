# =============================================================================
# gen_extra_llm_api_options.yaml — GENERATION(decode) 워커 변인통제 (TorchLlmArgs)
# trtllm-serve <MODEL> --backend pytorch --extra_llm_api_options <이 파일>
# -----------------------------------------------------------------------------
# ctx YAML과 동일 규칙. 차이: overlap scheduler ON. CUDA Graph는 OFF(양쪽 균일 eager — 변인통제).
# ⚠️ enable_block_reuse / free_gpu_memory_fraction 는 kv_cache_config 하위!
# CUDA Graph OFF: cuda_graph_config: null. (다시 켜려면 {enable_padding: true, max_batch_size: N} dict로.)
# =============================================================================

dtype: bfloat16
attn_backend: TRTLLM
enable_chunked_prefill: false
disable_overlap_scheduler: false   # decode는 overlap 켜는 게 일반적
cuda_graph_config: null            # CUDA Graph OFF (사용자 결정: 양쪽 균일 eager → 변인통제 + graph-capture cold-start 제거)
max_batch_size: 512          # decode 동시성 레버(전 config 동일·"비병목" 목표). 256→512.
                             #   ⚠️ 단일 GPU선 KV풀(free_gpu_memory_fraction)이 먼저 묶음(L4 seq~2560 → ~37동시) → 512는 D-TP/멀티GPU 확장 대비.
max_num_tokens: 16384        # decode는 iter당 ~batch개 토큰 → max_num_tokens >= max_batch_size면 충분(8192도 무방). 헤드룸 위해 상향.

# per-request perf 메트릭(KV전송시간 등) 수집 → orchestrator /perf_metrics로 노출 (analyze가 사용)
return_perf_metrics: true
perf_metrics_max_requests: 1000    # 워커 perf 버퍼 (>= 측정 N). 0이면 비활성

kv_cache_config:
  free_gpu_memory_fraction: 0.85   # ctx와 통일
  enable_block_reuse: false        # decode-heavy 단발 측정 — 변인통제상 양쪽 false
  dtype: auto

cache_transceiver_config:
  backend: NIXL                    # ctx와 반드시 동일(=DEFAULT). no-EFA에선 내부 UCX-TCP. 폴백=UCX.
  max_tokens_in_buffer: 8192
