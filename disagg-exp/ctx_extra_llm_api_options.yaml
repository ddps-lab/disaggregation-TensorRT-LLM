# =============================================================================
# ctx_extra_llm_api_options.yaml — CONTEXT(prefill) 워커 변인통제 (TorchLlmArgs)
# trtllm-serve <MODEL> --backend pytorch --extra_llm_api_options <이 파일>
# -----------------------------------------------------------------------------
# 검증(v1.2.1): yaml.safe_load → update_llm_args_with_extra_dict → TorchLlmArgs
#   (StrictBaseModel, extra="forbid") → 오타 키는 워커 기동 시 ValidationError.
# ⚠️ enable_block_reuse / free_gpu_memory_fraction 는 반드시 kv_cache_config 하위!
#    (top-level에 두면 즉시 ValidationError로 기동 실패.)
# ⚠️ TP/PP는 여기 두지 말고 CLI --tp_size/--pp_size 로 (중복·충돌 회피).
# ⚠️ dense Qwen3-4B → moe_config / enable_attention_dp 넣지 말 것 (축 아님).
# =============================================================================

dtype: bfloat16              # --dtype CLI 없음 → 여기서 지정. g5/g6/g6e(SM>=80) OK
attn_backend: TRTLLM         # FlashInfer 금지(비대칭 TP 오출력 #6507). 대문자 문자열
enable_chunked_prefill: false   # prefill 한 번에 = compute-bound 측정 (변인통제)
disable_overlap_scheduler: true # context 표준(overlap 미지원)
cuda_graph_config: null      # ctx는 decode graph 불필요 → 메모리 절약 (명시적 null = OFF)
max_batch_size: 512          # 큐 병목 제거(전 config 동일·"비병목" 목표). max_batch_size <= max_num_tokens 필수.
                             #   P/D·TP 확장 시 aggregate KV가 256 동시요청을 넘길 수 있어 상향(256→512). cap일 뿐 메모리 예약 아님.
max_num_tokens: 16384        # ctx는 chunked OFF → 한 iter에 prompt 통째 → max_num_tokens >= ISL(grid 최대 2048) 필수.
                             #   16384 = 8×2048 → prefill 다중 프롬프트 배칭 헤드룸. (활성화 버퍼↑ → KV풀 약간↓, Phase0 OOM 체크 대상)

# per-request perf 메트릭(KV전송시간 등) 수집 → orchestrator /perf_metrics로 노출 (analyze가 사용)
return_perf_metrics: true
perf_metrics_max_requests: 1000    # 워커 perf 버퍼 (>= 측정 N). 0이면 비활성

kv_cache_config:
  free_gpu_memory_fraction: 0.85   # KV에 할당할 free GPU mem 비율 (전 config 동일)
  enable_block_reuse: false        # 캐시 오염 차단 + PP hang 회피
  dtype: auto

cache_transceiver_config:
  backend: NIXL              # =DEFAULT(NVIDIA 기본·공식 disagg 벤치 일치). gen과 반드시 동일.
                             # no-EFA에선 내부 transport=UCX(TRTLLM_NIXL_KVCACHE_BACKEND 기본=UCX) → UCX_TLS=tcp 적용.
                             # libfabric은 EFA 쓸 때만(리빌드 필요). 문제 시 폴백=UCX.
  max_tokens_in_buffer: 8192 # >= 최대 ISL 권장 (prefill 2048이면 충분)
