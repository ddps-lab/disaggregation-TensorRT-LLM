# =============================================================================
# disagg_config.yaml — orchestrator(=trtllm-serve disaggregated -c) 정적 템플릿
# -----------------------------------------------------------------------------
# 이 파일은 1P1D 베이스라인 "참조/수동 실행"용. (자동 스윕은 launch_trtllm.sh가
# 런별로 $LOG_DIR/disagg_<LABEL>.yaml 을 생성하므로 이 파일을 덮어쓰지 않음.)
#
# 검증(v1.2.1): parse_disagg_config_file → yaml.safe_load → extract_disagg_cfg.
#   - top-level 키(model/backend 등)는 ctx/gen 양쪽에 상속 (양쪽에 다른값 또 적으면 ValueError)
#   - ctx/gen 블록은 num_instances/urls/router/max_batch_size/max_num_tokens만 직접 해석,
#     나머지는 other_args → get_llm_args
#   - ⚠️ orchestrator host/port는 CLI 불가 → 반드시 여기 hostname/port
#   - urls 개수 == num_instances (불일치 시 ValueError)
#   - 워커 변인통제(dtype/attn_backend/kv_cache/cuda_graph)는 워커의
#     --extra_llm_api_options(ctx/gen_extra_llm_api_options.yaml)가 담당 → 여기엔 토폴로지만.
#
# 수동 실행 예 (4-GPU 단일 노드):
#   CUDA_VISIBLE_DEVICES=0 trtllm-serve Qwen/Qwen3-4B --backend pytorch \
#       --host 0.0.0.0 --port 8001 --extra_llm_api_options ctx_extra_llm_api_options.yaml &
#   CUDA_VISIBLE_DEVICES=1 trtllm-serve Qwen/Qwen3-4B --backend pytorch \
#       --host 0.0.0.0 --port 8011 --extra_llm_api_options gen_extra_llm_api_options.yaml &
#   trtllm-serve disaggregated -c disagg_config.yaml -t 1800 -r 1800
# =============================================================================

hostname: 0.0.0.0          # orchestrator 바인드 주소 (CLI 불가 → 여기 필수)
port: 8000                 # sweep.py 조준 포트. 절대 8000
model: Qwen/Qwen3-4B       # ctx/gen에 상속 (get_llm_args positional model)
backend: pytorch
max_retries: 1
perf_metrics_max_requests: 1000   # orchestrator perf 버퍼 — /perf_metrics로 KV전송시간 노출. 0=off
#   (워커 ctx/gen extra YAML의 return_perf_metrics: true 와 짝)

# ===== context (prefill) 풀 =====
context_servers:
  num_instances: 1                 # = xPyD의 P 개수
  tensor_parallel_size: 1          # P의 TP (비대칭축). 워커 --tp_size와 일치시킬 것
  pipeline_parallel_size: 1        # P의 PP (비대칭축)
  cache_transceiver_config:
    backend: UCX                   # 워커 ctx YAML과 동일
  urls:
    - "localhost:8001"             # 워커 --port와 글자단위 일치, 개수==num_instances

# ===== generation (decode) 풀 =====
generation_servers:
  num_instances: 1                 # ★ = xPyD의 D 개수 (1P3D면 3 + urls 3개)
  tensor_parallel_size: 1          # D의 TP (비대칭축)
  pipeline_parallel_size: 1        # D의 PP (비대칭축)
  cache_transceiver_config:
    backend: UCX
  urls:
    - "localhost:8011"

# 1P3D 예시(주석): generation_servers.num_instances: 3 + urls: [localhost:8011, :8012, :8013]
# 비대칭 예시: context tp2/pp1, generation tp1/pp2 (⚠️ ctx-PP→gen-TP는 hang #14020 — Phase0 감시)
